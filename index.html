<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DarkGamesStar | بازی دو بعدی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #1a472a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-wrapper {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            background: #16213e;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 3px solid #4a6b3f;
        }

        /* ===== صفحات ===== */
        .page {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
        }

        .page.active {
            display: flex;
        }

        /* ===== صفحه اصلی ===== */
        .home-page {
            background: linear-gradient(135deg, #1a472a, #2d5a3a);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .home-page h1 {
            color: white;
            font-size: 36px;
            margin-bottom: 40px;
            text-shadow: 3px 3px 0 #2a5a2a;
        }

        /* ===== دکمه‌ها ===== */
        .btn {
            width: 100%;
            padding: 20px;
            margin: 10px 0;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            border: 2px solid white;
        }

        .btn-primary { background: #4CAF50; color: white; }
        .btn-warning { background: #ff9800; color: white; }
        .btn-danger { background: #f44336; color: white; }
        .btn-success { background: #4CAF50; color: white; }
        .btn-info { background: #2196F3; color: white; }
        .btn-small { padding: 10px; font-size: 14px; }

        /* ===== صفحه ورود ===== */
        .login-page {
            background: linear-gradient(135deg, #1a472a, #2d5a3a);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-title {
            color: white;
            font-size: 32px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0 #2a5a2a;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #0f3460;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }

        /* ===== صفحه بازی ===== */
        .game-page {
            background: #16213e;
        }

        .game-header {
            background: #0f3460;
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e94560;
        }

        .player-stats {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }

        .player-stats span {
            color: #e94560;
            font-weight: bold;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 35px;
            height: 35px;
            background: #1a1a2e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px solid #e94560;
            color: #e94560;
            font-size: 18px;
        }

        /* محیط بازی */
        .game-world {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: repeating-linear-gradient(45deg, #2d5a3a, #2d5a3a 20px, #3a6b4a 20px, #3a6b4a 40px);
        }

        .map-center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #1a472a, 4px 4px 0 rgba(0,0,0,0.3);
            background: rgba(0,0,0,0.4);
            padding: 12px 20px;
            border-radius: 40px;
            border: 2px solid rgba(255,255,255,0.5);
            pointer-events: none;
            z-index: 10;
        }

        /* کاراکتر بازی */
        .game-character {
            width: 40px;
            height: 40px;
            background: #e94560;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .character-name {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f3460;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            white-space: nowrap;
            border: 1px solid #e94560;
        }

        .job-label {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            padding: 4px 12px;
            border-radius: 20px;
            color: white;
            font-size: 11px;
            white-space: nowrap;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .character-id {
            font-size: 8px;
            color: rgba(255,255,255,0.7);
        }

        /* جویستیک */
        .joystick-area {
            height: 120px;
            background: #0f3460;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 2px solid #e94560;
        }

        .joystick {
            width: 80px;
            height: 80px;
            background: #1a1a2e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 3px solid #e94560;
            color: white;
            user-select: none;
            touch-action: none;
        }

        /* پنل بازرسی درون بازی */
        .inspector-game-panel {
            background: #0f3460;
            border-top: 2px solid #e94560;
            padding: 10px;
            display: none;
        }

        .inspector-game-panel.active {
            display: block;
        }

        .inspector-header {
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .inspector-list {
            max-height: 150px;
            overflow-y: auto;
        }

        .inspector-item {
            background: #1a1a2e;
            color: white;
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            border-right: 3px solid #2196F3;
        }

        .inspector-remove {
            background: #f44336;
            color: white;
            border: none;
            padding: 3px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
        }

        .copy-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
            margin-right: 5px;
        }

        /* ===== پنل سازنده ===== */
        .panel-page {
            background: #f5f5f5;
        }

        .panel-header {
            background: #333;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-tabs {
            display: flex;
            background: #444;
            padding: 10px;
            gap: 10px;
        }

        .tab-button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #666;
            color: white;
            font-weight: bold;
        }

        .tab-button.active {
            background: #e94560;
        }

        .panel-content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .panel-tab {
            display: none;
        }

        .panel-tab.active {
            display: block;
        }

        /* کارت آمار */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #e94560;
        }

        /* جستجو */
        .search-box {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        /* لیست کاربران */
        .users-list {
            margin-top: 20px;
        }

        .user-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-right: 4px solid #4CAF50;
        }

        .user-card.inspector {
            border-right-color: #2196F3;
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #eee;
        }

        .user-id {
            background: #e94560;
            color: white;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
        }

        .input-row {
            display: flex;
            align-items: center;
            margin: 8px 0;
            gap: 10px;
        }

        .input-row label {
            width: 60px;
            font-size: 12px;
            color: #666;
        }

        .input-row input, .input-row select {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .color-picker {
            width: 40px;
            height: 40px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        /* مودال */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 5px;
        }

        /* پنل شغل‌ها */
        .jobs-panel {
            background: white;
            border-radius: 10px;
            padding: 20px;
        }

        .job-section {
            margin-bottom: 20px;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
        }

        .player-tag {
            display: inline-block;
            padding: 5px 10px;
            margin: 3px;
            background: #f0f0f0;
            border-radius: 15px;
            font-size: 12px;
        }

        .error-text {
            color: #f44336;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <!-- ===== صفحه اصلی ===== -->
        <div id="homePage" class="page home-page active">
            <h1>🎮 DarkGamesStar</h1>
            <button class="btn btn-primary" onclick="gameUI.showGame()">🎮 ورود به بازی</button>
            <button class="btn btn-warning" onclick="gameUI.showPanelModal()">⚙️ پنل سازنده</button>
        </div>

        <!-- ===== صفحه ورود به بازی ===== -->
        <div id="loginPage" class="page login-page">
            <h2 class="login-title">🎮 ورود</h2>
            <input type="text" id="usernameInput" class="input-field" placeholder="نام خود را وارد کنید">
            <button class="btn btn-primary" onclick="gameUI.login()">شروع بازی</button>
            <button class="btn btn-danger" onclick="gameUI.backToHome()">بازگشت</button>
        </div>

        <!-- ===== صفحه بازی ===== -->
        <div id="gamePage" class="page game-page">
            <div class="game-header">
                <div class="player-stats">
                    <span>💰 <span id="coinDisplay">0</span></span>
                    <span>🆔 <span id="idDisplay">------</span></span>
                </div>
                <div class="header-buttons">
                    <div class="icon-btn" onclick="gameUI.showPlayerInfo()">👤</div>
                    <div class="icon-btn" onclick="gameUI.toggleInspectorPanel()" id="inspectorToggle" style="display: none;">👁️</div>
                </div>
            </div>

            <div class="game-world" id="gameWorld">
                <div class="map-center-text">DarkGamesStar</div>
                <div class="game-character" id="player">
                    <div class="character-name" id="playerNameDisplay"></div>
                    <div class="job-label" id="jobDisplay" onclick="gameUI.copyId()">بیکار</div>
                    <div class="character-id" id="idDisplay2"></div>
                </div>
            </div>

            <div class="joystick-area">
                <div class="joystick" id="joystick">🕹️</div>
            </div>

            <!-- پنل بازرسی درون بازی -->
            <div id="inspectorGamePanel" class="inspector-game-panel">
                <div class="inspector-header">
                    <span>👁️ پنل بازرسی</span>
                    <button class="btn-small btn-danger" onclick="gameUI.hideInspectorPanel()">✕</button>
                </div>
                <div class="inspector-list" id="inspectorList">
                    <!-- لیست بازرس‌ها -->
                </div>
            </div>
        </div>

        <!-- ===== صفحه پنل سازنده ===== -->
        <div id="panelPage" class="page panel-page">
            <div class="panel-header">
                <h2>⚙️ پنل سازنده</h2>
                <button class="btn btn-danger" onclick="gameUI.backToHome()" style="padding: 5px 15px;">بازگشت</button>
            </div>
            
            <div class="panel-tabs">
                <button class="tab-button active" onclick="gameUI.switchPanelTab('users')">👥 بازیکنان</button>
                <button class="tab-button" onclick="gameUI.switchPanelTab('inspectors')">👁️ بازرس‌ها</button>
                <button class="tab-button" onclick="gameUI.switchPanelTab('jobs')">💼 شغل‌ها</button>
            </div>

            <div class="panel-content">
                <!-- تب بازیکنان -->
                <div id="usersTab" class="panel-tab active">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div>کل بازیکنان</div>
                            <div class="stat-number" id="totalPlayers">0</div>
                        </div>
                        <div class="stat-card">
                            <div>آنلاین</div>
                            <div class="stat-number" id="onlinePlayers">0</div>
                        </div>
                    </div>

                    <input type="text" id="searchUser" class="search-box" placeholder="🔍 جستجو..." onkeyup="gameUI.searchUsers()">
                    <div id="usersList" class="users-list"></div>
                </div>

                <!-- تب بازرس‌ها -->
                <div id="inspectorsTab" class="panel-tab">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div>تعداد بازرس‌ها</div>
                            <div class="stat-number" id="totalInspectors">0</div>
                        </div>
                        <div class="stat-card">
                            <div>فعال</div>
                            <div class="stat-number" id="activeInspectors">0</div>
                        </div>
                    </div>
                    <div id="inspectorsList" class="users-list"></div>
                </div>

                <!-- تب شغل‌ها -->
                <div id="jobsTab" class="panel-tab">
                    <div class="jobs-panel">
                        <h3 style="margin-bottom: 15px;">📊 آمار شغل‌ها</h3>
                        <div id="jobsContent"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== مودال رمز پنل ===== -->
    <div id="panelModal" class="modal">
        <div class="modal-content">
            <h3>🔐 ورود به پنل سازنده</h3>
            <input type="password" id="panelPassword" class="input-field" placeholder="رمز را وارد کنید">
            <button class="btn btn-success" onclick="gameUI.checkPanelPassword()" style="margin: 10px 0;">تایید</button>
            <button class="btn btn-danger" onclick="gameUI.hidePanelModal()">انصراف</button>
            <div id="passwordError" class="error-text"></div>
        </div>
    </div>

    <!-- ===== مودال اطلاعات کاربر ===== -->
    <div id="infoModal" class="modal">
        <div class="modal-content">
            <h3>👤 اطلاعات کاربر</h3>
            <div class="info-row">
                <span>🆔 شناسه:</span>
                <span><strong id="infoId"></strong> <button class="copy-btn" onclick="gameUI.copyInfoId()">کپی</button></span>
            </div>
            <div class="info-row">
                <span>💰 سکه:</span>
                <span id="infoCoin"></span>
            </div>
            <div class="info-row">
                <span>💼 شغل:</span>
                <span id="infoJob"></span>
            </div>
            <div class="info-row">
                <span>👑 پنل:</span>
                <span id="infoPanel"></span>
            </div>
            <button class="btn btn-success" onclick="gameUI.hideInfoModal()" style="margin-top: 15px;">باشه</button>
        </div>
    </div>

    <script>
        const gameUI = {
            HASHED_PASSWORD: "52c97694fa813870b537913460338c8c58475cd319f6c1074c8e326b601a573b",
            
            users: JSON.parse(localStorage.getItem('game_users')) || [],
            currentUser: JSON.parse(localStorage.getItem('current_user')) || null,
            customJobs: JSON.parse(localStorage.getItem('custom_jobs')) || {},
            inspectorLogs: JSON.parse(localStorage.getItem('inspector_logs')) || [],

            // ===== توابع کمکی =====
            async sha256(message) {
                const msgBuffer = new TextEncoder().encode(message);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            },

            generateId() {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let id;
                do {
                    id = '';
                    for (let i = 0; i < 5; i++) {
                        id += chars[Math.floor(Math.random() * chars.length)];
                    }
                } while (this.users.some(u => u.id === id));
                return id;
            },

            getJobColor(job) {
                if (job === 'بیکار') return '#f44336';
                if (job === 'آشپز') return '#4CAF50';
                if (job === 'کارمند') return '#2196F3';
                return this.customJobs[job] || '#9C27B0';
            },

            isUserBanned(user) {
                return user.banned && new Date(user.banUntil) > new Date();
            },

            copyToClipboard(text) {
                navigator.clipboard?.writeText(text).then(() => {
                    alert('کپی شد: ' + text);
                }).catch(() => {
                    prompt('برای کپی، متن را انتخاب کنید:', text);
                });
            },

            // ===== ناوبری =====
            showPage(pageId) {
                document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
                document.getElementById(pageId).classList.add('active');
            },

            backToHome() {
                this.showPage('homePage');
            },

            // ===== بازی =====
            showGame() {
                if (this.currentUser) {
                    const user = this.users.find(u => u.id === this.currentUser.id);
                    if (user && !this.isUserBanned(user)) {
                        this.currentUser = user;
                        this.startGame();
                    } else {
                        this.currentUser = null;
                        localStorage.removeItem('current_user');
                        this.showPage('loginPage');
                    }
                } else {
                    this.showPage('loginPage');
                }
            },

            login() {
                const username = document.getElementById('usernameInput').value;
                if (!username) return alert('لطفاً نام خود را وارد کنید!');

                const newUser = {
                    id: this.generateId(),
                    name: username,
                    coin: 1000,
                    job: 'بیکار',
                    panel: 'ندارد',
                    banned: false,
                    banUntil: null
                };

                this.users.push(newUser);
                localStorage.setItem('game_users', JSON.stringify(this.users));
                
                this.currentUser = newUser;
                localStorage.setItem('current_user', JSON.stringify(this.currentUser));
                
                this.startGame();
            },

            startGame() {
                this.showPage('gamePage');
                const jobColor = this.getJobColor(this.currentUser.job);
                
                document.getElementById('coinDisplay').textContent = this.currentUser.coin;
                document.getElementById('idDisplay').textContent = this.currentUser.id;
                document.getElementById('idDisplay2').textContent = this.currentUser.id;
                document.getElementById('playerNameDisplay').textContent = this.currentUser.name;
                document.getElementById('jobDisplay').textContent = this.currentUser.job;
                document.getElementById('jobDisplay').style.background = jobColor;
                
                // بررسی پنل بازرسی
                this.updateInspectorButton();
                
                this.initJoystick();
            },

            initJoystick() {
                const joystick = document.getElementById('joystick');
                const player = document.getElementById('player');
                let isDragging = false;

                const movePlayer = (e) => {
                    if (!isDragging) return;
                    e.preventDefault();

                    const touch = e.touches ? e.touches[0] : e;
                    const gameWorld = document.getElementById('gameWorld');
                    const rect = gameWorld.getBoundingClientRect();

                    let x = touch.clientX - rect.left - 20;
                    let y = touch.clientY - rect.top - 20;

                    x = Math.max(0, Math.min(rect.width - 40, x));
                    y = Math.max(0, Math.min(rect.height - 40, y));

                    player.style.left = x + 'px';
                    player.style.top = y + 'px';
                };

                joystick.addEventListener('touchstart', () => isDragging = true);
                joystick.addEventListener('mousedown', () => isDragging = true);
                document.addEventListener('touchmove', movePlayer);
                document.addEventListener('mousemove', movePlayer);
                document.addEventListener('touchend', () => isDragging = false);
                document.addEventListener('mouseup', () => isDragging = false);
            },

            copyId() {
                if (this.currentUser) {
                    this.copyToClipboard(this.currentUser.id);
                }
            },

            copyInfoId() {
                const id = document.getElementById('infoId').textContent;
                this.copyToClipboard(id);
            },

            // ===== پنل بازرسی درون بازی =====
            updateInspectorButton() {
                const isInspector = this.currentUser && this.currentUser.panel === 'بازرس';
                document.getElementById('inspectorToggle').style.display = isInspector ? 'flex' : 'none';
                if (isInspector) {
                    this.loadInspectorList();
                }
            },

            toggleInspectorPanel() {
                const panel = document.getElementById('inspectorGamePanel');
                panel.classList.toggle('active');
                if (panel.classList.contains('active')) {
                    this.loadInspectorList();
                }
            },

            hideInspectorPanel() {
                document.getElementById('inspectorGamePanel').classList.remove('active');
            },

            loadInspectorList() {
                const listDiv = document.getElementById('inspectorList');
                const inspectors = this.users.filter(u => u.panel === 'بازرس' && !this.isUserBanned(u));
                
                if (inspectors.length === 0) {
                    listDiv.innerHTML = '<div style="color: #999; text-align: center;">بازرسی وجود ندارد</div>';
                    return;
                }

                let html = '';
                inspectors.forEach(inspector => {
                    html += `
                        <div class="inspector-item">
                            <div>
                                <strong>${inspector.name}</strong><br>
                                <span style="font-size: 9px;">${inspector.id}</span>
                            </div>
                            <button class="inspector-remove" onclick="gameUI.removeInspector('${inspector.id}')">برکناری</button>
                        </div>
                    `;
                });
                listDiv.innerHTML = html;
            },

            removeInspector(userId) {
                const userIndex = this.users.findIndex(u => u.id === userId);
                if (userIndex !== -1) {
                    this.users[userIndex].panel = 'ندارد';
                    localStorage.setItem('game_users', JSON.stringify(this.users));
                    
                    this.addInspectorLog('برکناری بازرس', userId);
                    
                    alert('بازرس برکنار شد');
                    this.loadInspectorList();
                    
                    if (this.currentUser && this.currentUser.id === userId) {
                        this.currentUser.panel = 'ندارد';
                        localStorage.setItem('current_user', JSON.stringify(this.currentUser));
                        this.updateInspectorButton();
                    }
                }
            },

            addInspectorLog(action, targetId) {
                const log = {
                    time: new Date().toISOString(),
                    action: action,
                    inspector: this.currentUser?.name || 'سیستم',
                    target: targetId
                };
                this.inspectorLogs.unshift(log);
                if (this.inspectorLogs.length > 50) this.inspectorLogs.pop();
                localStorage.setItem('inspector_logs', JSON.stringify(this.inspectorLogs));
            },

            // ===== اطلاعات کاربر =====
            showPlayerInfo() {
                if (!this.currentUser) return;
                document.getElementById('infoId').textContent = this.currentUser.id;
                document.getElementById('infoCoin').textContent = this.currentUser.coin;
                document.getElementById('infoJob').textContent = this.currentUser.job;
                document.getElementById('infoPanel').textContent = this.currentUser.panel;
                document.getElementById('infoModal').classList.add('active');
            },

            hideInfoModal() {
                document.getElementById('infoModal').classList.remove('active');
            },

            // ===== پنل سازنده =====
            showPanelModal() {
                document.getElementById('panelModal').classList.add('active');
                document.getElementById('panelPassword').value = '';
                document.getElementById('passwordError').style.display = 'none';
            },

            hidePanelModal() {
                document.getElementById('panelModal').classList.remove('active');
            },

            async checkPanelPassword() {
                const password = document.getElementById('panelPassword').value;
                const hash = await this.sha256(password);
                
                if (hash === this.HASHED_PASSWORD) {
                    this.hidePanelModal();
                    this.showPage('panelPage');
                    this.updatePanelData();
                } else {
                    document.getElementById('passwordError').style.display = 'block';
                    document.getElementById('passwordError').textContent = 'رمز اشتباه است!';
                }
            },

            switchPanelTab(tab) {
                document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.panel-tab').forEach(content => content.classList.remove('active'));
                
                if (tab === 'users') {
                    document.querySelectorAll('.tab-button')[0].classList.add('active');
                    document.getElementById('usersTab').classList.add('active');
                    this.updateUsersList();
                } else if (tab === 'inspectors') {
                    document.querySelectorAll('.tab-button')[1].classList.add('active');
                    document.getElementById('inspectorsTab').classList.add('active');
                    this.updateInspectorsList();
                } else if (tab === 'jobs') {
                    document.querySelectorAll('.tab-button')[2].classList.add('active');
                    document.getElementById('jobsTab').classList.add('active');
                    this.updateJobsPanel();
                }
            },

            updatePanelData() {
                const total = this.users.length;
                const online = this.users.filter(u => !this.isUserBanned(u)).length;
                
                document.getElementById('totalPlayers').textContent = total;
                document.getElementById('onlinePlayers').textContent = online;
                
                this.updateUsersList();
                this.updateInspectorsList();
                this.updateJobsPanel();
            },

            searchUsers() {
                this.updateUsersList();
            },

            updateUsersList() {
                const usersList = document.getElementById('usersList');
                const searchTerm = document.getElementById('searchUser')?.value.toLowerCase() || '';
                
                usersList.innerHTML = '';

                const filteredUsers = this.users.filter(user => 
                    user.name.toLowerCase().includes(searchTerm) || 
                    user.id.toLowerCase().includes(searchTerm)
                );

                filteredUsers.forEach((user) => {
                    const userIndex = this.users.findIndex(u => u.id === user.id);
                    
                    const card = document.createElement('div');
                    card.className = `user-card ${user.panel === 'بازرس' ? 'inspector' : ''}`;
                    
                    card.innerHTML = `
                        <div class="user-header">
                            <span class="user-id" onclick="gameUI.copyToClipboard('${user.id}')">${user.id}</span>
                            <span>${user.name}</span>
                        </div>
                        <div class="input-row">
                            <label>💰</label>
                            <input type="number" id="coin_${userIndex}" value="${user.coin}">
                        </div>
                        <div class="input-row">
                            <label>💼</label>
                            <input type="text" id="job_${userIndex}" value="${user.job}" style="flex: 2;">
                            <input type="color" id="color_${userIndex}" class="color-picker" value="${this.getJobColor(user.job)}">
                        </div>
                        <div class="input-row">
                            <label>👑</label>
                            <select id="panel_${userIndex}">
                                <option value="ندارد" ${user.panel === 'ندارد' ? 'selected' : ''}>ندارد</option>
                                <option value="بازرس" ${user.panel === 'بازرس' ? 'selected' : ''}>بازرس</option>
                                <option value="ویژه" ${user.panel === 'ویژه' ? 'selected' : ''}>ویژه</option>
                                <option value="پشتیبان" ${user.panel === 'پشتیبان' ? 'selected' : ''}>پشتیبان</option>
                                <option value="ادمین" ${user.panel === 'ادمین' ? 'selected' : ''}>ادمین</option>
                            </select>
                        </div>
                        <div class="action-buttons">
                            <button class="btn btn-success" onclick="gameUI.saveUserChanges(${userIndex})">💾 ذخیره</button>
                            ${!user.banned ? 
                                `<button class="btn btn-danger" onclick="gameUI.banUser(${userIndex})">🔨 بن</button>` :
                                `<button class="btn btn-success" onclick="gameUI.unbanUser(${userIndex})">🔓 آنبن</button>`
                            }
                        </div>
                    `;
                    usersList.appendChild(card);
                });
            },

            saveUserChanges(index) {
                const coin = document.getElementById(`coin_${index}`).value;
                const job = document.getElementById(`job_${index}`).value;
                const color = document.getElementById(`color_${index}`).value;
                const panel = document.getElementById(`panel_${index}`).value;
                const oldPanel = this.users[index].panel;

                if (job !== 'بیکار' && job !== 'آشپز' && job !== 'کارمند') {
                    this.customJobs[job] = color;
                    localStorage.setItem('custom_jobs', JSON.stringify(this.customJobs));
                }

                this.users[index].coin = parseInt(coin);
                this.users[index].job = job;
                this.users[index].panel = panel;

                localStorage.setItem('game_users', JSON.stringify(this.users));
                
                alert('تغییرات ذخیره شد!');
                
                if (this.currentUser && this.currentUser.id === this.users[index].id) {
                    this.currentUser = this.users[index];
                    localStorage.setItem('current_user', JSON.stringify(this.currentUser));
                    if (document.getElementById('coinDisplay')) {
                        document.getElementById('coinDisplay').textContent = this.currentUser.coin;
                        document.getElementById('jobDisplay').textContent = this.currentUser.job;
                        document.getElementById('jobDisplay').style.background = this.getJobColor(this.currentUser.job);
                        this.updateInspectorButton();
                    }
                }

                if (panel === 'بازرس' && oldPanel !== 'بازرس') {
                    this.addInspectorLog('افزودن بازرس جدید', this.users[index].id);
                }

                this.updatePanelData();
            },

            banUser(index) {
                const hours = prompt('مدت زمان بن (ساعت):', '24');
                if (!hours) return;
                
                const banUntil = new Date();
                banUntil.setHours(banUntil.getHours() + parseInt(hours));
                
                this.users[index].banned = true;
                this.users[index].banUntil = banUntil.toISOString();

                localStorage.setItem('game_users', JSON.stringify(this.users));
                
                alert(`کاربر ${this.users[index].name} بن شد!`);
                
                if (this.currentUser && this.currentUser.id === this.users[index].id) {
                    this.currentUser = null;
                    localStorage.removeItem('current_user');
                }
                
                this.updatePanelData();
            },

            unbanUser(index) {
                this.users[index].banned = false;
                this.users[index].banUntil = null;
                
                localStorage.setItem('game_users', JSON.stringify(this.users));
                
                alert(`کاربر ${this.users[index].name} آنبن شد!`);
                this.updatePanelData();
            },

            updateInspectorsList() {
                const inspectorsList = document.getElementById('inspectorsList');
                const inspectors = this.users.filter(u => u.panel === 'بازرس');
                
                document.getElementById('totalInspectors').textContent = inspectors.length;
                document.getElementById('activeInspectors').textContent = inspectors.filter(u => !this.isUserBanned(u)).length;
                
                if (inspectors.length === 0) {
                    inspectorsList.innerHTML = '<p style="color: #666; text-align: center;">هیچ بازرسی وجود ندارد</p>';
                    return;
                }

                let html = '';
                inspectors.forEach(inspector => {
                    const status = this.isUserBanned(inspector) ? '🚫 بن شده' : '✅ فعال';
                    html += `
                        <div class="user-card inspector">
                            <div class="user-header">
                                <span class="user-id" onclick="gameUI.copyToClipboard('${inspector.id}')">${inspector.id}</span>
                                <span>${inspector.name}</span>
                            </div>
                            <div style="margin: 5px 0;">
                                <span style="background: ${this.getJobColor(inspector.job)}; color: white; padding: 2px 8px; border-radius: 10px; font-size: 10px;">${inspector.job}</span>
                            </div>
                            <div style="font-size: 12px; margin-bottom: 10px;">وضعیت: ${status}</div>
                            <div class="action-buttons">
                                <button class="btn btn-danger" onclick="gameUI.removeInspector('${inspector.id}')">🔨 برکناری</button>
                            </div>
                        </div>
                    `;
                });
                inspectorsList.innerHTML = html;
            },

            updateJobsPanel() {
                const jobsContent = document.getElementById('jobsContent');
                
                const defaultJobs = [
                    { name: 'بیکار', color: '#f44336' },
                    { name: 'آشپز', color: '#4CAF50' },
                    { name: 'کارمند', color: '#2196F3' }
                ];
                
                let html = '';

                defaultJobs.forEach(job => {
                    const players = this.users.filter(u => u.job === job.name);
                    html += `
                        <div class="job-section">
                            <div class="job-header" style="background: ${job.color};">
                                <span>${job.name}</span>
                                <span style="background: rgba(255,255,255,0.3); padding: 3px 10px; border-radius: 20px;">${players.length}</span>
                            </div>
                            <div style="margin-top: 10px;">
                                ${players.map(p => `<span class="player-tag">${p.name}</span>`).join('') || '<span style="color: #999;">بازیکنی وجود ندارد</span>'}
                            </div>
                        </div>
                    `;
                });

                const customJobsList = Object.keys(this.customJobs);
                if (customJobsList.length > 0) {
                    html += '<h4 style="margin: 20px 0 10px;">✨ شغل‌های سفارشی:</h4>';
                    
                    customJobsList.forEach(job => {
                        const players = this.users.filter(u => u.job === job);
                        if (players.length > 0) {
                            html += `
                                <div class="job-section">
                                    <div class="job-header" style="background: ${this.customJobs[job]};">
                                        <span>${job}</span>
                                        <span style="background: rgba(255,255,255,0.3); padding: 3px 10px; border-radius: 20px;">${players.length}</span>
                                    </div>
                                    <div style="margin-top: 10px;">
                                        ${players.map(p => `<span class="player-tag">${p.name}</span>`).join('')}
                                    </div>
                                </div>
                            `;
                        }
                    });
                }

                jobsContent.innerHTML = html || '<p style="color: #666; text-align: center;">هیچ شغلی وجود ندارد</p>';
            }
        };

        // بستن مودال با کلیک خارج
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('active');
            }
        };
    </script>
</body>
    </html>
