<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازی دو بعدی | پنل سازنده</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #main-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
        }

        /* صفحه انتخاب */
        .screen {
            height: 100%;
            width: 100%;
            overflow-y: auto;
            position: relative;
        }

        .selection-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .selection-screen h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 32px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .selection-screen p {
            color: white;
            margin-bottom: 40px;
            font-size: 16px;
            opacity: 0.9;
        }

        .selection-btn {
            width: 100%;
            padding: 20px;
            margin: 10px 0;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .selection-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .game-btn {
            background: #4CAF50;
            color: white;
        }

        .panel-btn {
            background: #ff9800;
            color: white;
        }

        /* صفحه بازی */
        .game-screen {
            background: #16213e;
            display: none;
            flex-direction: column;
        }

        .game-header {
            background: #0f3460;
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e94560;
        }

        .player-info {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }

        .player-info span {
            color: #e94560;
            font-weight: bold;
        }

        .settings-icon {
            width: 35px;
            height: 35px;
            background: #1a1a2e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px solid #e94560;
            color: #e94560;
            font-size: 18px;
        }

        .game-world {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #1a1a2e;
        }

        #player {
            width: 40px;
            height: 40px;
            background: #e94560;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 10px;
            transition: all 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .job-badge {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f3460;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            border: 1px solid #e94560;
            white-space: nowrap;
        }

        .joystick-area {
            height: 120px;
            background: #0f3460;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 2px solid #e94560;
        }

        .joystick {
            width: 80px;
            height: 80px;
            background: #1a1a2e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 3px solid #e94560;
            color: white;
            font-size: 14px;
            user-select: none;
            touch-action: none;
        }

        /* مودال رمز */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            color: #333;
            margin-bottom: 20px;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            direction: ltr;
        }

        .modal-btn {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .confirm-btn {
            background: #4CAF50;
            color: white;
        }

        .cancel-btn {
            background: #f44336;
            color: white;
        }

        .error-msg {
            color: #f44336;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }

        /* پنل سازنده */
        .panel-screen {
            background: #f5f5f5;
            display: none;
            flex-direction: column;
        }

        .panel-header {
            background: #333;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .panel-header h2 {
            font-size: 18px;
        }

        .back-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .panel-tabs {
            display: flex;
            background: #444;
            padding: 10px;
            gap: 10px;
            position: sticky;
            top: 60px;
            z-index: 99;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #666;
            color: white;
            font-weight: bold;
        }

        .tab-btn.active {
            background: #e94560;
        }

        .panel-content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            padding-bottom: 30px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .stat-card .number {
            font-size: 24px;
            font-weight: bold;
            color: #e94560;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .users-list {
            margin-top: 20px;
        }

        .user-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-right: 4px solid #4CAF50;
        }

        .user-card.banned {
            border-right-color: #f44336;
            opacity: 0.7;
        }

        .user-card.inspector {
            border-right-color: #2196F3;
        }

        .user-card.special {
            border-right-color: #9C27B0;
        }

        .user-card.admin {
            border-right-color: #ff9800;
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #eee;
        }

        .user-id {
            background: #e94560;
            color: white;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .user-name {
            font-weight: bold;
            font-size: 16px;
        }

        .user-panel-badge {
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
        }

        .badge-inspector {
            background: #2196F3;
            color: white;
        }

        .badge-special {
            background: #9C27B0;
            color: white;
        }

        .badge-admin {
            background: #ff9800;
            color: white;
        }

        .badge-support {
            background: #4CAF50;
            color: white;
        }

        .user-details {
            margin: 10px 0;
        }

        .detail-row {
            display: flex;
            align-items: center;
            margin: 8px 0;
            gap: 10px;
        }

        .detail-row label {
            width: 50px;
            font-size: 12px;
            color: #666;
        }

        .detail-row input, .detail-row select {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .user-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .user-actions button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            min-width: 70px;
        }

        .save-btn {
            background: #4CAF50;
            color: white;
        }

        .ban-btn {
            background: #f44336;
            color: white;
        }

        .unban-btn {
            background: #4CAF50;
            color: white;
        }

        .inspector-panel-btn {
            background: #2196F3;
            color: white;
        }

        .ban-duration {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .ban-duration button {
            padding: 5px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            background: #ff9800;
            color: white;
        }

        /* پنل بازرسی */
        .inspector-dashboard {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }

        .inspector-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: #2196F3;
        }

        .activity-log {
            max-height: 300px;
            overflow-y: auto;
        }

        .log-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 12px;
        }

        .log-item .time {
            color: #999;
            font-size: 10px;
        }

        .log-item .action {
            margin-top: 5px;
        }

        .log-item.admin-action {
            background: #fff3e0;
            border-right: 3px solid #ff9800;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="main-container">
        <!-- صفحه انتخاب -->
        <div id="selectionScreen" class="screen selection-screen">
            <h1>🎮 بازی دو بعدی</h1>
            <p>لطفاً یکی از گزینه‌های زیر را انتخاب کنید</p>
            
            <button onclick="showGame()" class="selection-btn game-btn">🎮 ورود به بازی اصلی</button>
            <button onclick="showPanelModal()" class="selection-btn panel-btn">⚙️ ورود به پنل سازنده</button>
        </div>

        <!-- صفحه بازی -->
        <div id="gameScreen" class="screen game-screen">
            <!-- محتوای بازی با JS ساخته میشه -->
        </div>

        <!-- صفحه پنل سازنده -->
        <div id="panelScreen" class="screen panel-screen">
            <div class="panel-header">
                <h2>⚙️ پنل سازنده</h2>
                <button class="back-btn" onclick="backToMain()">بازگشت</button>
            </div>
            
            <div class="panel-tabs">
                <button class="tab-btn active" onclick="switchPanelTab('users')">👥 بازیکنان</button>
                <button class="tab-btn" onclick="switchPanelTab('inspector')">👁️ پنل بازرسی</button>
                <button class="tab-btn" onclick="switchPanelTab('admin')">👑 فعالیت ادمین</button>
            </div>

            <div class="panel-content">
                <!-- تب بازیکنان -->
                <div id="usersTab" class="tab-content active">
                    <div class="stats-cards">
                        <div class="stat-card">
                            <div>کل بازیکنان</div>
                            <div class="number" id="totalPlayers">0</div>
                        </div>
                        <div class="stat-card">
                            <div>آنلاین</div>
                            <div class="number" id="onlinePlayers">0</div>
                        </div>
                        <div class="stat-card">
                            <div>بن شده</div>
                            <div class="number" id="bannedPlayers">0</div>
                        </div>
                        <div class="stat-card">
                            <div>بازرس‌ها</div>
                            <div class="number" id="inspectorPlayers">0</div>
                        </div>
                    </div>

                    <input type="text" id="searchUser" class="search-box" placeholder="🔍 جستجو با نام یا شناسه..." onkeyup="searchUsers()">

                    <div id="usersList" class="users-list">
                        <!-- کاربران اینجا نمایش داده می‌شوند -->
                    </div>
                </div>

                <!-- تب پنل بازرسی -->
                <div id="inspectorTab" class="tab-content">
                    <div id="inspectorPanel">
                        <!-- محتوای پنل بازرسی -->
                    </div>
                </div>

                <!-- تب فعالیت ادمین -->
                <div id="adminTab" class="tab-content">
                    <div class="inspector-dashboard">
                        <div class="inspector-header">
                            <span>📋</span>
                            <h3>گزارش فعالیت‌های ادمین</h3>
                        </div>
                        <div id="adminActivityLog" class="activity-log">
                            <!-- لاگ فعالیت‌ها -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال رمز پنل -->
    <div id="panelModal" class="modal">
        <div class="modal-content">
            <h3>🔐 ورود به پنل سازنده</h3>
            <input type="password" id="panelPassword" class="modal-input" placeholder="رمز پنل را وارد کنید" dir="ltr">
            <button onclick="checkPanelPassword()" class="modal-btn confirm-btn">تایید</button>
            <button onclick="hidePanelModal()" class="modal-btn cancel-btn">انصراف</button>
            <div id="passwordError" class="error-msg">رمز وارد شده صحیح نیست!</div>
            <div id="loadingSpinner" style="display: none; text-align: center; margin-top: 10px;">
                <span class="loading"></span> در حال بررسی...
            </div>
        </div>
    </div>

    <!-- مودال اطلاعات کاربر -->
    <div id="infoModal" class="modal">
        <div class="modal-content">
            <h3>👤 اطلاعات کاربر</h3>
            <p>🆔 شناسه: <span id="infoId"></span></p>
            <p>💰 سکه: <span id="infoCoin"></span></p>
            <p>💼 شغل: <span id="infoJob"></span></p>
            <p>👑 پنل: <span id="infoPanel"></span></p>
            <button onclick="hideInfoModal()" class="modal-btn confirm-btn">باشه</button>
        </div>
    </div>

    <!-- مودال پنل بازرسی -->
    <div id="inspectorModal" class="modal">
        <div class="modal-content">
            <h3>👁️ پنل بازرسی</h3>
            <div id="inspectorContent">
                <!-- محتوای پنل بازرسی -->
            </div>
            <button onclick="hideInspectorModal()" class="modal-btn confirm-btn">بستن</button>
        </div>
    </div>

    <script>
        const HASHED_PASSWORD = "52c97694fa813870b537913460338c8c58475cd319f6c1074c8e326b601a573b";
        
        // دیتابیس محلی
        let users = JSON.parse(localStorage.getItem('game_users')) || [];
        let currentUser = JSON.parse(localStorage.getItem('current_user')) || null;
        let adminLogs = JSON.parse(localStorage.getItem('admin_logs')) || [];

        // توابع رمزنگاری
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        function generateUniqueId() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let id;
            do {
                id = '';
                for (let i = 0; i < 5; i++) {
                    id += chars[Math.floor(Math.random() * chars.length)];
                }
            } while (users.some(u => u.id === id));
            return id;
        }

        function addAdminLog(action, adminName, targetName) {
            const log = {
                time: new Date().toISOString(),
                action: action,
                admin: adminName,
                target: targetName
            };
            adminLogs.unshift(log);
            if (adminLogs.length > 50) adminLogs.pop();
            localStorage.setItem('admin_logs', JSON.stringify(adminLogs));
        }

        // نمایش صفحه‌ها
        function showGame() {
            document.getElementById('selectionScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            document.getElementById('panelScreen').style.display = 'none';
            
            if (currentUser) {
                // اگه کاربر قبلا لاگین کرده بود
                const user = users.find(u => u.id === currentUser.id);
                if (user && !isUserBanned(user)) {
                    currentUser = user;
                    startGame();
                } else {
                    currentUser = null;
                    localStorage.removeItem('current_user');
                    showLoginScreen();
                }
            } else {
                showLoginScreen();
            }
        }

        function showPanel() {
            document.getElementById('selectionScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('panelScreen').style.display = 'flex';
            updatePanelData();
        }

        function backToMain() {
            document.getElementById('selectionScreen').style.display = 'flex';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('panelScreen').style.display = 'none';
        }

        function switchPanelTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tab === 'users') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('usersTab').classList.add('active');
            } else if (tab === 'inspector') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('inspectorTab').classList.add('active');
                updateInspectorPanel();
            } else if (tab === 'admin') {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('adminTab').classList.add('active');
                updateAdminLogs();
            }
        }

        // مودال رمز
        function showPanelModal() {
            document.getElementById('panelModal').style.display = 'flex';
            document.getElementById('panelPassword').value = '';
            document.getElementById('passwordError').style.display = 'none';
        }

        function hidePanelModal() {
            document.getElementById('panelModal').style.display = 'none';
        }

        async function checkPanelPassword() {
            const password = document.getElementById('panelPassword').value;
            const errorMsg = document.getElementById('passwordError');
            const loading = document.getElementById('loadingSpinner');
            
            if (!password) {
                errorMsg.textContent = 'لطفاً رمز را وارد کنید!';
                errorMsg.style.display = 'block';
                return;
            }

            loading.style.display = 'block';
            
            try {
                const hash = await sha256(password);
                
                if (hash === HASHED_PASSWORD) {
                    loading.style.display = 'none';
                    hidePanelModal();
                    showPanel();
                } else {
                    loading.style.display = 'none';
                    errorMsg.textContent = 'رمز وارد شده صحیح نیست!';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                loading.style.display = 'none';
                errorMsg.textContent = 'خطا در بررسی رمز!';
                errorMsg.style.display = 'block';
            }
        }

        function isUserBanned(user) {
            if (!user.banned || !user.banUntil) return false;
            return new Date(user.banUntil) > new Date();
        }

        // صفحه ورود بازی
        function showLoginScreen() {
            const gameScreen = document.getElementById('gameScreen');
            gameScreen.innerHTML = `
                <div class="login-screen" style="display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); height: 100%;">
                    <h2 style="color: #e94560; margin-bottom: 30px; font-size: 32px;">🎮 ورود به بازی</h2>
                    <input type="text" id="username" class="login-input" placeholder="نام خود را وارد کنید" style="width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #0f3460; border-radius: 10px; background: #1a1a2e; color: white;">
                    <button onclick="login()" class="login-btn" style="width: 100%; padding: 15px; background: #e94560; color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; margin-top: 20px;">شروع بازی</button>
                </div>
            `;
        }

        async function login() {
            const username = document.getElementById('username').value;
            if (!username) {
                alert('لطفاً نام خود را وارد کنید!');
                return;
            }

            // ایجاد کاربر جدید
            const newUser = {
                id: generateUniqueId(),
                name: username,
                coin: 1000,
                job: 'بیکار',
                panel: 'ندارد',
                banned: false,
                banUntil: null,
                lastLogin: new Date().toISOString()
            };

            users.push(newUser);
            localStorage.setItem('game_users', JSON.stringify(users));
            
            currentUser = newUser;
            localStorage.setItem('current_user', JSON.stringify(currentUser));
            
            startGame();
        }

        function startGame() {
            const gameScreen = document.getElementById('gameScreen');
            gameScreen.innerHTML = `
                <div class="game-header">
                    <div class="player-info">
                        <span>💰 <span id="coinDisplay">${currentUser.coin}</span></span>
                        <span>🆔 <span id="idDisplay">${currentUser.id}</span></span>
                    </div>
                    <div class="settings-icon" onclick="showPlayerInfo()">⚙️</div>
                </div>

                <div class="game-world" id="gameWorld">
                    <div id="player" style="top: 50%; left: 50%;">
                        <div class="job-badge" id="jobDisplay">${currentUser.job}</div>
                    </div>
                </div>

                <div class="joystick-area">
                    <div class="joystick" id="joystick">🕹️</div>
                </div>
            `;
            initJoystick();
        }

        // جویستیک
        function initJoystick() {
            const joystick = document.getElementById('joystick');
            const player = document.getElementById('player');
            let isDragging = false;

            const movePlayer = (e) => {
                if (!isDragging) return;
                e.preventDefault();

                const touch = e.touches ? e.touches[0] : e;
                const gameWorld = document.getElementById('gameWorld');
                const rect = gameWorld.getBoundingClientRect();

                let x = touch.clientX - rect.left - 20;
                let y = touch.clientY - rect.top - 20;

                // محدودیت حرکت
                x = Math.max(0, Math.min(rect.width - 40, x));
                y = Math.max(0, Math.min(rect.height - 40, y));

                player.style.left = x + 'px';
                player.style.top = y + 'px';
            };

            joystick.addEventListener('touchstart', (e) => {
                isDragging = true;
                e.preventDefault();
            });

            joystick.addEventListener('mousedown', (e) => {
                isDragging = true;
                e.preventDefault();
            });

            document.addEventListener('touchmove', movePlayer);
            document.addEventListener('mousemove', movePlayer);

            document.addEventListener('touchend', () => {
                isDragging = false;
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });
        }

        // اطلاعات کاربر
        function showPlayerInfo() {
            if (!currentUser) return;
            document.getElementById('infoId').textContent = currentUser.id;
            document.getElementById('infoCoin').textContent = currentUser.coin;
            document.getElementById('infoJob').textContent = currentUser.job;
            document.getElementById('infoPanel').textContent = currentUser.panel;
            document.getElementById('infoModal').style.display = 'flex';
        }

        function hideInfoModal() {
            document.getElementById('infoModal').style.display = 'none';
        }

        // پنل سازنده
        function updatePanelData() {
            updateStats();
            updateUsersList();
        }

        function updateStats() {
            const now = new Date();
            const total = users.length;
            const online = users.filter(u => !isUserBanned(u)).length;
            const banned = users.filter(u => isUserBanned(u)).length;
            const inspectors = users.filter(u => u.panel === 'بازرس').length;

            document.getElementById('totalPlayers').textContent = total;
            document.getElementById('onlinePlayers').textContent = online;
            document.getElementById('bannedPlayers').textContent = banned;
            document.getElementById('inspectorPlayers').textContent = inspectors;
        }

        function searchUsers() {
            updateUsersList();
        }

        function updateUsersList() {
            const usersList = document.getElementById('usersList');
            const searchTerm = document.getElementById('searchUser')?.value.toLowerCase() || '';
            
            usersList.innerHTML = '';

            const filteredUsers = users.filter(user => 
                user.name.toLowerCase().includes(searchTerm) || 
                user.id.toLowerCase().includes(searchTerm)
            );

            filteredUsers.forEach((user, index) => {
                const userIndex = users.findIndex(u => u.id === user.id);
                const isBanned = isUserBanned(user);
                
                const userCard = document.createElement('div');
                userCard.className = `user-card ${isBanned ? 'banned' : ''} ${user.panel === 'بازرس' ? 'inspector' : ''} ${user.panel === 'ویژه' ? 'special' : ''} ${user.panel === 'ادمین' ? 'admin' : ''}`;
                
                let panelBadge = '';
                if (user.panel !== 'ندارد') {
                    let badgeClass = '';
                    if (user.panel === 'بازرس') badgeClass = 'badge-inspector';
                    else if (user.panel === 'ویژه') badgeClass = 'badge-special';
                    else if (user.panel === 'ادمین') badgeClass = 'badge-admin';
                    else if (user.panel === 'پشتیبان') badgeClass = 'badge-support';
                    
                    panelBadge = `<span class="user-panel-badge ${badgeClass}">${user.panel}</span>`;
                }

                userCard.innerHTML = `
                    <div class="user-header">
                        <span class="user-id">${user.id}</span>
                        <span class="user-name">${user.name}</span>
                        ${panelBadge}
                    </div>
                    <div class="user-details">
                        <div class="detail-row">
                            <label>💰 سکه</label>
                            <input type="number" id="coin_${userIndex}" value="${user.coin}" placeholder="سکه">
                        </div>
                        <div class="detail-row">
                            <label>💼 شغل</label>
                            <input type="text" id="job_${userIndex}" value="${user.job}" placeholder="شغل (هر چیزی میتونی بنویسی)">
                        </div>
                        <div class="detail-row">
                            <label>👑 پنل</label>
                            <select id="panel_${userIndex}">
                                <option value="ندارد" ${user.panel === 'ندارد' ? 'selected' : ''}>ندارد</option>
                                <option value="بازرس" ${user.panel === 'بازرس' ? 'selected' : ''}>بازرس</option>
                                <option value="ویژه" ${user.panel === 'ویژه' ? 'selected' : ''}>ویژه</option>
                                <option value="پشتیبان" ${user.panel === 'پشتیبان' ? 'selected' : ''}>پشتیبان</option>
                                <option value="ادمین" ${user.panel === 'ادمین' ? 'selected' : ''}>ادمین</option>
                            </select>
                        </div>
                    </div>
                    <div class="user-actions">
                        <button class="save-btn" onclick="saveUserChanges(${userIndex})">💾 ذخیره</button>
                        ${isBanned ? 
                            `<button class="unban-btn" onclick="unbanUser(${userIndex})">🔓 آنبن</button>` : 
                            `<button class="ban-btn" onclick="showBanOptions(${userIndex})">🔨 بن</button>`
                        }
                    </div>
                    ${!isBanned && user.panel === 'بازرس' ? `
                        <div class="user-actions">
                            <button class="inspector-panel-btn" onclick="openInspectorPanel(${userIndex})">👁️ فعال‌سازی پنل بازرسی</button>
                        </div>
                    ` : ''}
                    <div id="banOptions_${userIndex}" class="ban-duration">
                        <button onclick="banUser(${userIndex}, 1)">1 ساعت</button>
                        <button onclick="banUser(${userIndex}, 5)">5 ساعت</button>
                        <button onclick="banUser(${userIndex}, 12)">12 ساعت</button>
                        <button onclick="banUser(${userIndex}, 24)">1 روز</button>
                        <button onclick="banUser(${userIndex}, 168)">1 هفته</button>
                    </div>
                `;
                usersList.appendChild(userCard);
            });
        }

        function saveUserChanges(index) {
            const coin = document.getElementById(`coin_${index}`).value;
            const job = document.getElementById(`job_${index}`).value;
            const panel = document.getElementById(`panel_${index}`).value;
            const oldPanel = users[index].panel;

            users[index].coin = parseInt(coin);
            users[index].job = job;
            users[index].panel = panel;

            localStorage.setItem('game_users', JSON.stringify(users));
            
            // لاگ فعالیت ادمین
            addAdminLog('تغییر اطلاعات کاربر', 'ادمین', users[index].name);
            
            alert('تغییرات ذخیره شد!');
            
            // آپدیت اطلاعات کاربر فعلی اگه هست
            if (currentUser && currentUser.id === users[index].id) {
                currentUser = users[index];
                localStorage.setItem('current_user', JSON.stringify(currentUser));
                if (document.getElementById('coinDisplay')) {
                    document.getElementById('coinDisplay').textContent = currentUser.coin;
                    document.getElementById('jobDisplay').textContent = currentUser.job;
                }
            }

            // اگه پنل بازرسی فعال شده
            if (panel === 'بازرس' && oldPanel !== 'بازرس') {
                addAdminLog('فعال‌سازی پنل بازرسی', 'ادمین', users[index].name);
            }

            updateStats();
        }

        function showBanOptions(index) {
            const banDiv = document.getElementById(`banOptions_${index}`);
            banDiv.style.display = banDiv.style.display === 'grid' ? 'none' : 'grid';
        }

        function banUser(index, hours) {
            const banUntil = new Date();
            banUntil.setHours(banUntil.getHours() + hours);
            
            users[index].banned = true;
            users[index].banUntil = banUntil.toISOString();

            localStorage.setItem('game_users', JSON.stringify(users));
            
            // لاگ فعالیت ادمین
            addAdminLog(`بن کاربر به مدت ${hours} ساعت`, 'ادمین', users[index].name);
            
            alert(`کاربر ${users[index].name} به مدت ${hours} ساعت بن شد!`);
            
            // اگه کاربر فعلی بن شده
            if (currentUser && currentUser.id === users[index].id) {
                currentUser = null;
                localStorage.removeItem('current_user');
            }
            
            updatePanelData();
        }

        function unbanUser(index) {
            users[index].banned = false;
            users[index].banUntil = null;
            
            localStorage.setItem('game_users', JSON.stringify(users));
            
            // لاگ فعالیت ادمین
            addAdminLog('آنبن کاربر', 'ادمین', users[index].name);
            
            alert(`کاربر ${users[index].name} آنبن شد!`);
            updatePanelData();
        }

        // پنل بازرسی
        function updateInspectorPanel() {
            const inspectorPanel = document.getElementById('inspectorPanel');
            
            const now = new Date();
            const bannedUsers = users.filter(u => isUserBanned(u));
            const onlineUsers = users.filter(u => !isUserBanned(u));
            
            let html = `
                <div class="inspector-dashboard">
                    <div class="inspector-header">
                        <span>👁️</span>
                        <h3>داشبورد بازرسی</h3>
                    </div>
                    
                    <div class="stats-cards">
                        <div class="stat-card">
                            <div>کاربران آنلاین</div>
                            <div class="number">${onlineUsers.length}</div>
                        </div>
                        <div class="stat-card">
                            <div>کاربران بن شده</div>
                            <div class="number">${bannedUsers.length}</div>
                        </div>
                    </div>

                    <h4 style="margin: 15px 0 10px;">🚫 لیست کاربران بن شده</h4>
            `;

            if (bannedUsers.length === 0) {
                html += `<p style="color: #666; text-align: center;">هیچ کاربر بن شده‌ای وجود ندارد</p>`;
            } else {
                bannedUsers.forEach(user => {
                    const until = new Date(user.banUntil).toLocaleString('fa-IR');
                    html += `
                        <div class="user-card banned" style="margin-bottom: 10px;">
                            <div style="display: flex; justify-content: space-between;">
                                <span>${user.name}</span>
                                <span class="user-id">${user.id}</span>
                            </div>
                            <div style="font-size: 12px; margin-top: 5px; color: #f44336;">
                                ⏰ تا ${until}
                            </div>
                        </div>
                    `;
                });
            }

            html += `</div>`;
            inspectorPanel.innerHTML = html;
        }

        function openInspectorPanel(index) {
            const user = users[index];
            if (user.panel !== 'بازرس') {
                alert('این کاربر پنل بازرسی ندارد!');
                return;
            }

            const now = new Date();
            const bannedUsers = users.filter(u => isUserBanned(u));
            
            let content = `
                <div style="text-align: right;">
                    <h4 style="color: #2196F3; margin-bottom: 15px;">👁️ پنل بازرسی - ${user.name}</h4>
                    
                    <div class="stats-cards" style="margin-bottom: 20px;">
                        <div class="stat-card">
                            <div>کل کاربران</div>
                            <div class="number">${users.length}</div>
                        </div>
                        <div class="stat-card">
                            <div>کاربران بن شده</div>
                            <div class="number">${bannedUsers.length}</div>
                        </div>
                    </div>

                    <h5 style="margin-bottom: 10px;">🚫 لیست کاربران بن شده:</h5>
            `;

            if (bannedUsers.length === 0) {
                content += `<p style="color: #666;">هیچ کاربر بن شده‌ای وجود ندارد</p>`;
            } else {
                bannedUsers.forEach(bannedUser => {
                    const until = new Date(bannedUser.banUntil).toLocaleString('fa-IR');
                    content += `
                        <div style="background: #f5f5f5; padding: 10px; border-radius: 5px; margin-bottom: 5px;">
                            <div><strong>${bannedUser.name}</strong> (${bannedUser.id})</div>
                            <div style="font-size: 12px; color: #f44336;">⏰ تا ${until}</div>
                        </div>
                    `;
                });
            }

            content += `</div>`;
            
            document.getElementById('inspectorContent').innerHTML = content;
            document.getElementById('inspectorModal').style.display = 'flex';
            
            // لاگ فعالیت بازرس
            addAdminLog('فعال‌سازی پنل بازرسی', user.name, 'سیستم');
        }

        function hideInspectorModal() {
            document.getElementById('inspectorModal').style.display = 'none';
        }

        // لاگ فعالیت ادمین
        function updateAdminLogs() {
            const logDiv = document.getElementById('adminActivityLog');
            
            if (adminLogs.length === 0) {
                logDiv.innerHTML = '<p style="color: #666; text-align: center;">هیچ فعالیتی ثبت نشده</p>';
                return;
            }

            let html = '';
            adminLogs.forEach(log => {
                const time = new Date(log.time).toLocaleString('fa-IR');
                html += `
                    <div class="log-item admin-action">
                        <div class="time">${time}</div>
                        <div class="action">
                            <strong>${log.admin}</strong> ${log.action} 
                            ${log.target ? `برای <strong>${log.target}</strong>` : ''}
                        </div>
                    </div>
                `;
            });
            
            logDiv.innerHTML = html;
        }

        // بستن مودال با کلیک خارج
        window.onclick = function(event) {
            const panelModal = document.getElementById('panelModal');
            const infoModal = document.getElementById('infoModal');
            const inspectorModal = document.getElementById('inspectorModal');
            
            if (event.target == panelModal) {
                hidePanelModal();
            }
            if (event.target == infoModal) {
                hideInfoModal();
            }
            if (event.target == inspectorModal) {
                hideInspectorModal();
            }
        }

        // اینتر در مودال رمز
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && document.getElementById('panelModal').style.display === 'flex') {
                checkPanelPassword();
            }
        });

        // مقداردهی اولیه
        if (users.length === 0) {
            // اضافه کردن کاربران تستی
            users.push({
                id: 'ADMIN',
                name: 'مدیر سیستم',
                coin: 999999,
                job: 'مدیر',
                panel: 'ادمین',
                banned: false,
                banUntil: null,
                lastLogin: new Date().toISOString()
            });
            
            users.push({
                id: 'TEST1',
                name: 'کاربر تستی',
                coin: 5000,
                job: 'آشپز',
                panel: 'بازرس',
                banned: false,
                banUntil: null,
                lastLogin: new Date().toISOString()
            });
            
            localStorage.setItem('game_users', JSON.stringify(users));
        }

        // لاگ تستی
        if (adminLogs.length === 0) {
            adminLogs.push({
                time: new Date().toISOString(),
                action: 'راه‌اندازی پنل',
                admin: 'سیستم',
                target: null
            });
            localStorage.setItem('admin_logs', JSON.stringify(adminLogs));
        }
    </script>
</body>
